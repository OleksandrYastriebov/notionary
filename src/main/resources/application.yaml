app:
  email:
    from: "s1t1a1w1r1@gmail.com"
  brevo:
    api-key: ${BREVO_API_KEY}
    api-url: "https://api.brevo.com/v3/smtp/email"
  url:
    frontend: ${FRONTEND_URL:localhost:3000}
    backend: ${BACKEND_URL:localhost:8080}
  limits:
    max-wishlists: 50
    max-items-per-list: 50
    max-shares-per-wishlist: 30
token:
  signing:
    key: ${TOKEN_SIGNING_KEY}
  refresh:
    expiration:
      sec: 2629800
    max:
      sessions:
        count: 5
  jwt:
    expiration:
      ms: 900000
  confirmation:
    expiration:
      days: 1

email:
  from:
    value: ${EMAIL_FROM_VALUE}

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5671
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: komdjyax
    ssl:
      enabled: true
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  datasource:
    url: jdbc:postgresql://ep-divine-mouse-alb0as1v-pooler.c-3.eu-central-1.aws.neon.tech:5432/${DATABASE_NAME}?sslmode=require
    username: ${DATABASE_LOGIN}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 15MB

  mvc:
    async:
      request-timeout: 30000

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7

logging:
  level:
    org.springframework.core.events.SpringDocAppInitializer: ERROR

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
